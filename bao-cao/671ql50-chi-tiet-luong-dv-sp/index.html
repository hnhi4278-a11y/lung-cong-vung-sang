function money(v){ return Math.round(v).toLocaleString('vi-VN').replace(/,/g,'.'); }
function sumItemRange(days, s, e, field){
  let t = 0;
  for (const d in days){ if (d >= s && d <= e) t += (days[d][field] || 0); }
  return t;
}

function renderColumn(elId, s, e){
  const groupsOrder = ['Stylist','Skinner','Sup'];
  const groups = {};
  let salonQty = 0, salonDtdv = 0, salonTip = 0;

  for (const sid in DATA.staff){
    const st = DATA.staff[sid];
    const typeBlocks = {};
    let staffQty = 0, staffDtdv = 0, staffTip = 0;
    for (const iid in st.items){
      const it = st.items[iid];
      const qty = sumItemRange(it.days, s, e, 'qty');
      const dtdv = sumItemRange(it.days, s, e, 'dtdv');
      const tip = sumItemRange(it.days, s, e, 'tip');
      if (qty===0 && dtdv===0 && tip===0) continue;
      const tb = typeBlocks[it.type] || (typeBlocks[it.type] = []);
      tb.push({ name: it.name, qty, dtdv, tip });
      staffQty += qty; staffDtdv += dtdv; staffTip += tip;
    }
    if (staffQty===0 && staffDtdv===0 && staffTip===0) continue;
    const g = groupsOrder.includes(st.group) ? st.group : 'Sup';
    (groups[g] || (groups[g]=[])).push({ name: st.name, staffQty, staffDtdv, staffTip, typeBlocks });
    salonQty += staffQty; salonDtdv += staffDtdv; salonTip += staffTip;
  }

  let html = '<div class="salon-total"><span>Tổng salon</span><span>SL ' + Math.round(salonQty).toLocaleString('vi-VN') +
    ' · DTDV ' + money(salonDtdv) + 'đ · Tip ' + money(salonTip) + 'đ</span></div>';

  for (const g of groupsOrder){
    const members = groups[g];
    if (!members || !members.length) continue;
    html += '<div class="group-title">' + g + ' (' + members.length + ' người)</div>';
    members.sort((a,b) => b.staffDtdv - a.staffDtdv);
    for (const m of members){
      html += '<details class="staff"><summary><span>' + m.name + '</span><span class="staff-nums">SL ' +
        Math.round(m.staffQty).toLocaleString('vi-VN') + ' · DTDV ' + money(m.staffDtdv) + 'đ · Tip ' + money(m.staffTip) + 'đ</span></summary>';
      const typeOrder = ['DV','Upsale','SP'];
      const typeLabel = { DV:'Dịch vụ', Upsale:'Upsale', SP:'Sản phẩm' };
      for (const t of typeOrder){
        const rows = m.typeBlocks[t];
        if (!rows || !rows.length) continue;
        rows.sort((a,b) => b.dtdv - a.dtdv);
        let subQty=0, subDtdv=0, subTip=0;
        let rowsHtml = '';
        for (const r of rows){
          subQty += r.qty; subDtdv += r.dtdv; subTip += r.tip;
          rowsHtml += '<tr><td>' + r.name + '</td><td class="num">' + Math.round(r.qty).toLocaleString('vi-VN') +
            '</td><td class="num">' + money(r.dtdv) + '</td><td class="num">' + money(r.tip) + '</td></tr>';
        }
        html += '<div class="type-block"><div class="type-title">' + typeLabel[t] + '</div><table class="items">' + rowsHtml +
          '<tr class="subtotal"><td>Tổng ' + typeLabel[t].toLowerCase() + '</td><td class="num">' + Math.round(subQty).toLocaleString('vi-VN') +
          '</td><td class="num">' + money(subDtdv) + '</td><td class="num">' + money(subTip) + '</td></tr></table></div>';
      }
      html += '</details>';
    }
  }
  if (!html) html = '<div class="empty">Không có dữ liệu trong khoảng ngày này.</div>';
  document.getElementById(elId).innerHTML = html;
}

function render(p1s, p1e, p2s, p2e){
  document.getElementById('subLabel').textContent =
    'Kỳ báo cáo ' + p2s + ' → ' + p2e + '   ·   Kỳ so sánh ' + p1s + ' → ' + p1e;
  renderColumn('colReport', p2s, p2e);
  renderColumn('colCompare', p1s, p1e);
}

document.getElementById('applyBtn').addEventListener('click', function(){
  render(
    document.getElementById('p1s').value, document.getElementById('p1e').value,
    document.getElementById('p2s').value, document.getElementById('p2e').value
  );
});

document.getElementById('p1s').value = DATA.defaults.p1s;
document.getElementById('p1e').value = DATA.defaults.p1e;
document.getElementById('p2s').value = DATA.defaults.p2s;
document.getElementById('p2e').value = DATA.defaults.p2e;
document.getElementById('p1s').min = DATA.range[0]; document.getElementById('p1s').max = DATA.range[1];
document.getElementById('p1e').min = DATA.range[0]; document.getElementById('p1e').max = DATA.range[1];
document.getElementById('p2s').min = DATA.range[0]; document.getElementById('p2s').max = DATA.range[1];
document.getElementById('p2e').min = DATA.range[0]; document.getElementById('p2e').max = DATA.range[1];
render(DATA.defaults.p1s, DATA.defaults.p1e, DATA.defaults.p2s, DATA.defaults.p2e);
